<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" fill="none" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="rail-metal" x2="0" y2="1"><stop stop-color="#8c928f"/><stop offset=".2" stop-color="#434b48"/><stop offset=".65" stop-color="#161e1b"/><stop offset="1" stop-color="#646e67"/></linearGradient>
    <!-- Spec silhouette: 19.125 × 6.2 openings, 6.2 ribs in an 11-high
         rail, scaled to 24 illustration units. Not fabrication geometry. -->
    <rect id="makerrail-void" width="41.73" height="13.53" rx="2.18"/>
    <g id="makerrail-voids">
      <use href="#makerrail-void" x="24" y="5.235"/>
      <use href="#makerrail-void" x="79.26" y="5.235"/>
      <use href="#makerrail-void" x="134.52" y="5.235"/>
      <use href="#makerrail-void" x="189.78" y="5.235"/>
      <use href="#makerrail-void" x="245.04" y="5.235"/>
      <use href="#makerrail-void" x="300.30" y="5.235"/>
      <use href="#makerrail-void" x="355.56" y="5.235"/>
      <use href="#makerrail-void" x="410.82" y="5.235"/>
    </g>
    <mask id="makerrail-cutouts" maskUnits="userSpaceOnUse"
          x="-1" y="-1" width="480" height="26">
      <rect x="-1" y="-1" width="480" height="26" fill="white"/>
      <use href="#makerrail-voids" fill="black"/>
    </mask>
    <clipPath id="makerrail-short-bounds">
      <rect width="245" height="24"/>
    </clipPath>
    <g id="makerrail-long">
      <rect width="478" height="24" fill="url(#rail-metal)"
            stroke="#a1aaa0" mask="url(#makerrail-cutouts)"/>
      <use href="#makerrail-voids" stroke="#a1aaa0" stroke-width=".8"/>
    </g>
    <g id="makerrail-short" clip-path="url(#makerrail-short-bounds)">
      <rect width="245" height="24" fill="url(#rail-metal)"
            stroke="#a1aaa0" mask="url(#makerrail-cutouts)"/>
      <use href="#makerrail-voids" stroke="#a1aaa0" stroke-width=".8"/>
    </g>
    <linearGradient id="panel-light" x2=".8" y2="1"><stop stop-color="#fffdf3"/><stop offset="1" stop-color="#bfbfb0"/></linearGradient>
    <linearGradient id="panel-accent" x2=".7" y2="1"><stop stop-color="#d4f479"/><stop offset="1" stop-color="#91bd29"/></linearGradient>
    <linearGradient id="panel-dark" x2=".8" y2="1"><stop stop-color="#515952"/><stop offset="1" stop-color="#252e28"/></linearGradient>
    <radialGradient id="knob-cap" cx=".35" cy=".25"><stop stop-color="#68716a"/><stop offset=".7" stop-color="#303b33"/><stop offset="1" stop-color="#121a15"/></radialGradient>
    <pattern id="vent-slots" width="14" height="12" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="8" height="5" rx="2.5" fill="#121a16"/></pattern>
    <pattern id="key-grid" width="29" height="31" patternUnits="userSpaceOnUse"><rect x="2" y="3" width="25" height="27" rx="4" fill="#131b16"/><rect x="2" y="1" width="25" height="24" rx="4" fill="#e7e6da"/><path d="M8 6h12" stroke="#fff" stroke-opacity=".6"/></pattern>
    <g id="fastener"><circle r="4.2" fill="#1c2520"/><circle cy="-.7" r="3.2" fill="#929990"/><path d="M-1.8-2.5 1.8 1.1M-1.8 1.1 1.8-2.5" stroke="#2a322c" stroke-width="1"/></g>
    <g id="knob"><circle cy="7" r="29" fill="#101813"/><circle r="29" fill="#1a241d" stroke="#798276" stroke-width="1.5"/><circle cy="-4" r="26" fill="url(#knob-cap)"/><path d="M0-26v10" stroke="#f5f1dc" stroke-width="3" stroke-linecap="round"/></g>
    <filter id="soft-shadow" x="-40%" y="-40%" width="180%" height="200%"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <g stroke="#879187" stroke-opacity=".17" stroke-width="1">
    <path d="m25 408 481-145M59 451l481-145M100 493l481-145M144 535l481-145M135 287l274 253M239 256l274 253M343 225l274 253"/>
  </g>
  <ellipse cx="354" cy="412" rx="233" ry="73" fill="#060e09" opacity=".65" filter="url(#soft-shadow)"/>
  <g transform="translate(60 192) matrix(.94 -.28 .42 .82 0 0)">
    <g class="assembly-frame">
      <use href="#makerrail-short" transform="translate(24 63) rotate(90)"/>
      <use href="#makerrail-short" transform="translate(478 63) rotate(90)"/>
      <use href="#makerrail-long" x="0" y="39"/>
      <use href="#makerrail-long" x="0" y="308"/>
      <path d="M100 55v257M240 55v257M379 55v257" stroke="#8d988d" stroke-width="1" stroke-dasharray="4 7" opacity=".45"/>
    </g>
    <g class="assembly-panels">
      <g class="assembly-panel assembly-panel--one">
        <rect x="8" y="29" width="149" height="277" rx="4" fill="#536d23" stroke="#121c15"/>
        <rect x="8" y="20" width="149" height="277" rx="4" fill="url(#panel-accent)" stroke="#e4f8ac"/>
        <g fill="#2f3f17" font-family="monospace" font-size="8" letter-spacing="1.2"><text x="22" y="47">MP / ANALOG</text><text x="23" y="280">MAKE IT TANGIBLE.</text><text x="70" y="143">INPUT</text><text x="66" y="237">OUTPUT</text></g>
        <path d="M24 56h117" stroke="#536b24" stroke-opacity=".7"/>
        <circle cx="83" cy="100" r="36" stroke="#405719" stroke-dasharray="1 5" stroke-width="3"/>
        <use href="#knob" x="83" y="100"/>
        <circle cx="83" cy="193" r="36" stroke="#405719" stroke-dasharray="1 5" stroke-width="3"/>
        <use href="#knob" x="83" y="193"/>
        <use href="#fastener" x="18" y="29"/><use href="#fastener" x="146" y="29"/><use href="#fastener" x="18" y="287"/><use href="#fastener" x="146" y="287"/>
      </g>
      <g class="assembly-panel assembly-panel--two">
        <rect x="165" y="29" width="155" height="277" rx="4" fill="#899080" stroke="#172017"/>
        <rect x="165" y="20" width="155" height="277" rx="4" fill="url(#panel-light)" stroke="#fffced"/>
        <g fill="#40483d" font-family="monospace" font-size="8" letter-spacing="1.2"><text x="181" y="47">MP / INTERFACE</text><text x="181" y="280">YOUR NEXT MOVE.</text></g>
        <rect x="182" y="67" width="121" height="68" rx="3" fill="#1a251d" stroke="#a2a998" stroke-width="3"/>
        <g fill="#b3d1a6" font-family="monospace"><text x="191" y="84" font-size="6.5">HELLO, MAKER.</text><text x="192" y="111" font-size="20">01 / ∞</text><path d="M192 123h77" stroke="#7e9b74" stroke-width="2"/></g>
        <rect x="184" y="153" width="116" height="93" rx="3" fill="url(#key-grid)"/>
        <rect x="273" y="217" width="25" height="24" rx="4" fill="#b8e63e"/>
        <use href="#fastener" x="175" y="29"/><use href="#fastener" x="310" y="29"/><use href="#fastener" x="175" y="287"/><use href="#fastener" x="310" y="287"/>
      </g>
      <g class="assembly-panel assembly-panel--three">
        <rect x="328" y="29" width="141" height="277" rx="4" fill="#18221b" stroke="#121c15"/>
        <rect x="328" y="20" width="141" height="277" rx="4" fill="url(#panel-dark)" stroke="#707b6c"/>
        <g fill="#c3cebc" font-family="monospace" font-size="8" letter-spacing="1.2"><text x="343" y="47">MP / UTILITY</text><text x="343" y="280">ROOM TO GROW.</text></g>
        <rect x="343" y="62" width="111" height="100" rx="3" fill="url(#vent-slots)"/>
        <path d="M344 180h109" stroke="#909c84" stroke-opacity=".5"/>
        <rect x="344" y="196" width="42" height="24" rx="5" fill="#162218" stroke="#819176"/><rect x="351" y="203" width="28" height="10" rx="5" fill="#0a100c" stroke="#737f6e"/>
        <circle cx="428" cy="208" r="14" fill="#0f1912" stroke="#99a58c" stroke-width="3"/><circle cx="428" cy="208" r="5" fill="#5a6753"/>
        <g fill="#b4c1ac" font-family="monospace" font-size="6"><text x="352" y="234">CONNECT</text><text x="417" y="234">POWER</text></g>
        <circle cx="347" cy="253" r="3" fill="#c3e1a4"/>
        <use href="#fastener" x="338" y="29"/><use href="#fastener" x="459" y="29"/><use href="#fastener" x="338" y="287"/><use href="#fastener" x="459" y="287"/>
      </g>
    </g>
  </g>
  <g font-family="monospace" font-size="9" letter-spacing="1" fill="#b7c0b2"><path d="M45 168h45l36 39" fill="none" stroke="#7e8e77"/><circle cx="126" cy="207" r="3" fill="#ccf064"/><text x="45" y="155">SWAP THE PIECES.</text><path d="M438 481h131v-46" fill="none" stroke="#7e8e77"/><text x="391" y="502">KEEP THE POSSIBILITIES.</text></g>
</svg>