  <circle cx="64" cy="18" r="3" fill="#333"/>
  <circle cx="96" cy="18" r="3" fill="#333"/>
  <circle cx="118" cy="18" r="3" fill="#333"/>
  
  <circle cx="10" cy="110" r="3" fill="#333"/>
  <circle cx="32" cy="110" r="3" fill="#333"/>
  <circle cx="64" cy="110" r="3" fill="#333"/>
