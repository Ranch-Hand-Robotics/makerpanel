<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="128" fill="#f0f0f0"/>
  
  <!-- 4 HP 2U Panel -->
  <rect x="40" y="8" width="48" height="112" fill="#FFA726" stroke="#F57C00" stroke-width="2"/>
  
  <!-- Mounting holes (8 total) -->
  <circle cx="48" cy="25" r="2.5" fill="#333"/>
  <circle cx="80" cy="25" r="2.5" fill="#333"/>
  
  <circle cx="48" cy="51" r="2.5" fill="#333"/>
  <circle cx="80" cy="51" r="2.5" fill="#333"/>
  
  <circle cx="48" cy="77" r="2.5" fill="#333"/>
  <circle cx="80" cy="77" r="2.5" fill="#333"/>
  
  <circle cx="48" cy="103" r="2.5" fill="#333"/>
  <circle cx="80" cy="103" r="2.5" fill="#333"/>
  
  <!-- Label -->
  <text x="64" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">4HP</text>
  
  <!-- Size indicator -->
  <text x="64" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">2U</text>
  <text x="64" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555">20x89mm</text>
</svg>
