name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install thumbnail dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run thumbnails:setup

      - name: Restore thumbnail cache
        uses: actions/cache@v4
        with:
          path: docs/images/panels/generated
          key: thumbnails-${{ runner.os }}-${{ hashFiles('package-lock.json', 'thumbnails.config.json', 'scripts/thumbnails/**', 'examples/**', 'makerpanel/**', 'docs/gallery.json', 'docs/panels/**') }}
          restore-keys: thumbnails-${{ runner.os }}-

      - name: Test and generate thumbnails
        run: |
          npm test
          npm run thumbnails

      - name: Upload thumbnail diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-report
          path: .cache/thumbnails/report.json
          if-no-files-found: ignore

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
