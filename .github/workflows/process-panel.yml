name: Process Panel Submission

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number of the panel submission'
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Install OpenSCAD for thumbnail generation
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb

      - name: Process panel issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python .github/scripts/process_panel_issue.py ${{ inputs.issue_number }}

      - name: Generate SCAD thumbnails
        run: |
          python .github/scripts/generate_scad_thumbnails.py

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add docs/panels/
          git add docs/images/panels/generated/ || true
          git add docs/gallery.json || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Add panel from issue #${{ inputs.issue_number }}"
          git push

      - name: Trigger deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });

      - name: Comment on issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.issue_number }},
              body: '🎉 **Your panel has been added to the gallery!**\n\nIt will be visible on the site shortly after deployment completes.\n\nView it at: https://ranch-hand-robotics.github.io/makerpanel/gallery/\n\nThank you for your contribution!'
            });

      - name: Close issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.issue_number }},
              state: 'closed',
              labels: ['new-panel', 'processed']
            });
