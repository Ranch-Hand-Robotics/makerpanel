name: 🔧 Submit a Panel Design
description: Add your maker panel to the Makerpanel gallery!
title: "[Panel] "
labels: ["new-panel"]
body:
  - type: markdown
    attributes:
      value: |
        ## Welcome to Makerpanel! 🔧
        Fill out this form and we'll review your panel design. Once approved, it'll show up in the gallery automatically!

        **Commercial panels are welcome.** If you sell your panel, include a Buy Now link below — the gallery happily lists both free/open designs and commercial products.

  - type: input
    id: name
    attributes:
      label: Panel Name
      placeholder: "e.g., Dual Potentiometer Control"
    validations:
      required: true

  - type: input
    id: tagline
    attributes:
      label: One-line description
      description: Keep it brief — this shows on the gallery card.
      placeholder: "e.g., Two 10kΩ linear potentiometers for analog control"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Panel Category
      description: Which category best fits your panel? Select "Other" to suggest a new category.
      options:
        - Analog Control
        - Visual Feedback
        - Connectivity
        - Digital I/O
        - Sensor
        - Actuator
        - Audio
        - Power
        - Other
    validations:
      required: true

  - type: input
    id: custom_category
    attributes:
      label: Custom Category (if "Other" selected)
      description: If you selected "Other" above, suggest a new category name here.
      placeholder: "e.g., Sensors, Motors, Display Systems"

  - type: input
    id: horizontal_pitch
    attributes:
      label: Horizontal Pitch (HP)
      description: Panel width in HP units.
      placeholder: "e.g., 8"
    validations:
      required: true

  - type: input
    id: vertical_units
    attributes:
      label: Vertical Units (U)
      description: Panel height in U units.
      placeholder: "e.g., 3"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Tell us about your panel
      description: A few sentences about what it does, why you built it, and what makes it useful.
      placeholder: "What does it do? Why did you build it? What problems does it solve?"
    validations:
      required: true

  - type: input
    id: github_url
    attributes:
      label: GitHub Repository or Design Files URL
      description: Link to your design files, CAD files, schematics, etc.
      placeholder: "https://github.com/you/your-panel"
    validations:
      required: false

  - type: input
    id: purchase_url
    attributes:
      label: Buy Now URL (optional)
      description: |
        Link to where people can purchase this panel or kit. Commercial listings are fully allowed —
        Tindie, your own shop, Etsy, eBay, or anywhere else you sell.
      placeholder: "https://tindie.com/products/you/your-panel"

  - type: textarea
    id: thumbnail
    attributes:
      label: Thumbnail Image
      description: Upload a square image (400×400px minimum) showing your panel. Drag and drop or paste the image here.
      placeholder: "Drag and drop your image here..."
    validations:
      required: false

  - type: textarea
    id: images
    attributes:
      label: Additional Photos (optional)
      description: Upload additional photos showing different angles, assembly, or usage. Drag and drop or paste images here.
      placeholder: "Drag and drop your images here..."

  - type: input
    id: license
    attributes:
      label: License
      description: Your design files license (recommend open source)
      placeholder: "e.g., MIT, CC-BY-SA-4.0, CERN-OHL-S-2.0"
    validations:
      required: true
