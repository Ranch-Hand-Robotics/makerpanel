site_name: MakerPanel.tech
site_description: An open hardware standard for modular panels. Build a cyberdeck, a control surface, or something nobody has imagined yet.
site_author: Ranch Hand Robotics
site_url: https://makerpanel.tech/

repo_name: Ranch-Hand-Robotics/makerpanel
repo_url: https://github.com/Ranch-Hand-Robotics/makerpanel
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Explore panels: gallery.md
  - The standard: specification.md
  - MakerStack: makerstack.md
  - Start building: create-panel.md
  - About: about.md

theme:
  name: mkdocs
  custom_dir: theme

# The custom theme uses its own catalog search, not the bundled search UI.
plugins: []

extra_css:
  - css/site.css

markdown_extensions:
  - attr_list
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
  - tables
  - toc:
      permalink: true

use_directory_urls: false
strict: true
not_in_nav: |
  panels/**/index.md
  openscad.md
  freecad.md
  fusion360.md

hooks:
  - .github/hooks.py
