site_name: Makerpanel
site_description: Specification and Gallery of Maker Panels
site_author: Ranch Hand Robotics
site_url: https://ranch-hand-robotics.github.io/makerpanel

repo_name: Ranch-Hand-Robotics/makerpanel
repo_url: https://github.com/Ranch-Hand-Robotics/makerpanel
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Specification: specification.md
  - Gallery: gallery.md
  - Contributing: contributing.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
  logo: https://raw.githubusercontent.com/FortAwesome/Font-Awesome/6.x/svgs/solid/wrench.svg
  favicon: https://raw.githubusercontent.com/FortAwesome/Font-Awesome/6.x/svgs/solid/wrench.svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ranch-Hand-Robotics/makerpanel
      name: GitHub Repository
    - icon: fontawesome/solid/wrench
      link: https://ranch-hand-robotics.github.io/makerpanel
      name: Makerpanel Home

extra_css:
  - css/custom.css

markdown_extensions:
  - attr_list
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
  - tables
  - toc:
      permalink: true

use_directory_urls: false
strict: true

hooks:
  - .github/hooks.py
