<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="2100"
     viewBox="0 0 2600 2100" role="img" aria-labelledby="title desc">
  <title id="title">Complete joystick controller wiring — SparkFun Pro Micro RP2350</title>
  <desc id="desc">USB-powered SparkFun Pro Micro RP2350 with two joysticks,
    a Qwiic ADS1219 and a normally closed auxiliary stop contact. Joystick 1:
    X=GPIO26, Y=GPIO27, twist=GPIO28, button=GPIO2. Joystick 2:
    X=AIN0, Y=AIN3, twist=AIN2, button=AIN1. A 4.7 kohm resistor connects
    REFP (3V3) to AIN1; the button and optional 100 nF capacitor connect
    AIN1 to ground. Stop uses GPIO3 with a 4.7 kohm pull-up to 3V3.
    Qwiic uses GPIO16 SDA and GPIO17 SCL, 3V3 and GND. Matching net labels
    connect electrically. X/Y labels identify original wired pots, not the
    rotated USB axes: joystick 1 X = old Y, Y = -old X;
    joystick 2 Rx = -old Y, Ry = -old X (ADS horizontal correction).
    Board drawings are simplified, not to scale.</desc>
