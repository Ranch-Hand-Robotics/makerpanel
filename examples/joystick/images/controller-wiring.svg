  <text x="85" y="496" class="label">GND</text>
  <text x="85" y="584" class="label">J1_BTN</text>
  <text x="85" y="628" class="label">STOP</text>
  <text x="980" y="519" class="label">3V3 · shared supply</text>
  <text x="980" y="607" class="label">J1_TWIST</text>
  <text x="980" y="651" class="label">J1_Y</text>
  <text x="980" y="695" class="label">J1_X</text>
  <text x="85" y="707" class="note">GPIO2: internal pull-up</text>
  <text x="85" y="739" class="note">GPIO3: see stop circuit</text>
  <text x="980" y="422" class="note">RAW: leave unused</text>
  <text x="980" y="457" class="note">for this USB-powered build</text>
  <text x="70" y="960" class="note">Only labeled signal leads are used. Other GPIO and A3 remain unconnected.</text>
  <text x="70" y="990" class="note">All GND pads are common. Drawing is simplified; confirm the silkscreen before soldering.</text>

