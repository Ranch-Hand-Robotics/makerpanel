              stroke-linecap: round; }
      .x { stroke: #2563eb; } .y { stroke: #4b7e16; }
      .twist { stroke: #7c3aed; } .button { stroke: #b32386; }
      .power { stroke: #d22d43; } .ground { stroke: #334155; }
      .stop { stroke: #526475; }
    </style>
