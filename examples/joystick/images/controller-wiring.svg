    <g id="gnd" fill="none" stroke="#334155" stroke-width="4">
      <path d="M0 0 V12 M-20 12 H20 M-13 21 H13 M-6 30 H6"/>
    </g>
    <!-- Pot terminals: left/right are supply/ground; lower arrow is wiper. -->
    <g id="pot" fill="none" stroke="#334155" stroke-width="4">
