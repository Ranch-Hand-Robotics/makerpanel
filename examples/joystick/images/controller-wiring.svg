  <text x="1990" y="625" text-anchor="middle" class="silk">Inner row is NOT duplicate signal inputs</text>
  <text x="1450" y="888" class="label">Required jumpers: REFP → 3V3; REFN → GND</text>
  <text x="1450" y="928" class="note">Use breakout 3V3/GND pads for these reference connections and joystick 2 power.</text>
  <text x="1450" y="962" class="note">REFP is not a power output. Qwiic power alone does not connect the reference.</text>
  <text x="1450" y="992" class="note">DRDY unused; RESET stays at breakout default. See the photo detail for pad locations.</text>

  <!-- Matching net names connect the three circuit cards to the board maps. -->
