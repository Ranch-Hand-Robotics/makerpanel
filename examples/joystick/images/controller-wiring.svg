  <text x="1515" y="349" class="body" data-signal="SDA" data-gpio="16">3V3 + GND + SDA (GPIO16) + SCL (GPIO17)</text>
  <g data-signal="SCL" data-gpio="17"/>
  <rect x="1550" y="510" width="880" height="325" rx="18"
        fill="#ac2436" stroke="#7c1827" stroke-width="3"/>
  <text x="1990" y="682" text-anchor="middle" class="silk">ADS1219 · 24-BIT ADC</text>
