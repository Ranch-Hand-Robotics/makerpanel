  <text x="70" y="1132" class="note">Three 10 kΩ pots + normally open top button</text>
  <g transform="translate(410 1200)"><use href="#pot"/></g>
  <g transform="translate(410 1350)"><use href="#pot"/></g>
  <g transform="translate(410 1500)"><use href="#pot"/></g>
  <g class="label">
    <text x="80" y="1208">X</text><text x="80" y="1358">Y</text>
    <text x="80" y="1508">TWIST</text>
    <text x="203" y="1208" style="fill:#d22d43">3V3</text>
    <text x="203" y="1358" style="fill:#d22d43">3V3</text>
    <text x="203" y="1508" style="fill:#d22d43">3V3</text>
    <text x="555" y="1208">GND</text><text x="555" y="1358">GND</text>
    <text x="555" y="1508">GND</text>
  </g>
  <path d="M410 1275 H580" class="wire x"/>
  <path d="M410 1425 H580" class="wire y"/>
  <path d="M410 1575 H580" class="wire twist"/>
  <text x="595" y="1283" class="label">J1_X</text>
  <text x="595" y="1433" class="label">J1_Y</text>
  <text x="595" y="1583" class="label">J1_TWIST</text>
  <path d="M215 1640 H410" class="wire button"/>
  <text x="80" y="1648" class="label">J1_BTN</text>
  <use href="#no-switch" x="410" y="1640"/>
  <use href="#gnd" x="410" y="1750"/>
  <text x="465" y="1680" class="body">Top button (NO)</text>
  <text x="465" y="1720" class="note">GPIO2 internal pull-up;</text>
  <text x="465" y="1750" class="note">no external resistor needed.</text>

  <rect x="870" y="1050" width="830" height="760" rx="20" class="card"/>
  <text x="900" y="1097" class="heading">4 / JOYSTICK 2 · VIA ADS1219</text>
  <text x="900" y="1132" class="note">Same pot wiring; button needs the external pull-up</text>
  <g transform="translate(1190 1200)"><use href="#pot"/></g>
  <g transform="translate(1190 1350)"><use href="#pot"/></g>
  <g transform="translate(1190 1500)"><use href="#pot"/></g>
  <g class="label">
    <text x="900" y="1208">X</text><text x="900" y="1358">Y</text>
    <text x="900" y="1508">TWIST</text>
    <text x="1000" y="1208" style="fill:#d22d43">3V3</text>
    <text x="1000" y="1358" style="fill:#d22d43">3V3</text>
    <text x="1000" y="1508" style="fill:#d22d43">3V3</text>
    <text x="1335" y="1208">GND</text><text x="1335" y="1358">GND</text>
    <text x="1335" y="1508">GND</text>
  </g>
  <path d="M1190 1275 H1380" class="wire x"/>
  <path d="M1190 1425 H1380" class="wire y"/>
  <path d="M1190 1575 H1380" class="wire twist"/>
  <text x="1395" y="1283" class="label">J2_X / AIN0</text>
  <text x="1395" y="1433" class="label">J2_Y / AIN3</text>
  <text x="1395" y="1583" class="label">J2_TWIST / AIN2</text>
  <text x="900" y="1655" class="label">Button circuit is enlarged at right →</text>
  <text x="900" y="1700" class="note">Connect each pot's two outer terminals to 3V3 and GND.</text>
  <text x="900" y="1734" class="note">Only its center wiper goes to the signal input.</text>
  <text x="900" y="1775" class="note">Verify switch and wiper wires with a meter; colors vary.</text>

  <rect x="1730" y="1050" width="830" height="435" rx="20" class="card"/>
  <text x="1760" y="1097" class="heading">5 / AIN1 BUTTON · YOUR 4.7 kΩ PULL-UP</text>
  <text x="1760" y="1140" class="label">REFP (tied to 3V3)</text>
  <path d="M1800 1154 V1180" class="wire power"/>
  <rect x="1787" y="1180" width="26" height="60" fill="white"
        stroke="#334155" stroke-width="4"/>
  <text x="1835" y="1207" class="label">R1 · 4.7 kΩ</text>
  <path d="M1800 1240 V1270 H2420" class="wire button"/>
  <text x="1880" y="1255" class="label">J2_BTN / AIN1</text>
  <circle cx="2150" cy="1270" r="7" fill="#b32386"/>
  <circle cx="2420" cy="1270" r="7" fill="#b32386"/>
  <path d="M2150 1270 V1305 M2127 1305 H2173 M2127 1323 H2173
           M2150 1323 V1380" class="wire ground"/>
  <use href="#no-switch" x="2420" y="1270"/>
  <use href="#gnd" x="2150" y="1380"/><use href="#gnd" x="2420" y="1380"/>
  <text x="1835" y="1340" class="body">C1 · 100 nF</text>
  <text x="1835" y="1373" class="note">Optional filter →</text>
  <text x="2240" y="1335" class="note">Button</text>
  <text x="2240" y="1365" class="note">NO →</text>
  <text x="1760" y="1454" class="note">Do not bridge AIN1 directly to REFP — always use the resistor.</text>

  <rect x="1730" y="1510" width="830" height="300" rx="20" class="card"/>
  <text x="1760" y="1557" class="heading">6 / STOP · AUXILIARY CONTACT ONLY</text>
  <text x="1760" y="1627" class="label">3V3</text>
  <path d="M1830 1620 H1860 M1940 1620 H2150 V1650 H2270"
        class="wire stop"/>
  <rect x="1860" y="1607" width="80" height="26" fill="white"
        stroke="#334155" stroke-width="4"/>
  <text x="1850" y="1588" class="small">R2 · 4.7 kΩ</text>
  <circle cx="2150" cy="1620" r="7" fill="#526475"/>
  <text x="2050" y="1597" class="label">STOP / GPIO3</text>
  <!-- NC switch shown closed in its healthy/released position. -->
  <path d="M2270 1650 H2360 M2360 1650 H2410 V1675"
        class="wire ground"/>
  <circle cx="2270" cy="1650" r="5" fill="white" stroke="#334155" stroke-width="3"/>
  <circle cx="2360" cy="1650" r="5" fill="white" stroke="#334155" stroke-width="3"/>
  <use href="#gnd" x="2410" y="1675"/>
  <text x="2252" y="1629" class="small">NC</text>
  <text x="2342" y="1629" class="small">COM</text>
  <text x="1760" y="1728" class="note">Closed = healthy. Pressed / open wire = USB Button 3.</text>
  <text x="1760" y="1760" class="note">Status only. Axes and top buttons keep reporting.</text>
  <text x="1760" y="1792" class="note">Not a safety-rated emergency stop; no motor power here.</text>

  <rect x="40" y="1840" width="2520" height="170" rx="18" fill="#172638"/>
  <text x="70" y="1885" font-size="27" font-weight="700" style="fill:#c8ec89">HOW TO READ / BEFORE POWERING UP</text>
  <text x="70" y="1923" font-size="23" style="fill:white">Matching net names connect together: J1_X to J1_X, J2_BTN to J2_BTN, etc. All 3V3 labels share one supply; all GND symbols share ground.</text>
  <text x="70" y="1957" font-size="23" style="fill:white">Line colors identify signals, NOT joystick wire colors. NO = normally open; NC = normally closed. Button released ≈ 3.3 V; pressed ≈ 0 V.</text>
  <text x="70" y="1991" font-size="23" style="fill:white">Power off before wiring. Never feed RAW / 5 V into the pots or ADC inputs. An unwired, enabled stop input asserts Button 3 without blocking joystick reports.</text>
  <text x="50" y="2047" class="small">90° RIGHT MOUNT: labels are ORIGINAL pot wires. J1: X = old Y, Y = -old X. J2: Rx = -old Y, Ry = -old X. Do not swap wires. Twist unchanged.</text>
  <text x="50" y="2080" class="small">Pro Micro header order is component-side, USB-C up. ADS1219 outer row is left-to-right AIN3, AIN2, REFN, REFP, AIN1, AIN0. See images/README.md for references.</text>
</svg>