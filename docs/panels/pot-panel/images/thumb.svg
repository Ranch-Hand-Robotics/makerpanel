<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Panel background -->
  <rect width="400" height="400" fill="#2c2c2c"/>
  
  <!-- Panel outline -->
  <rect x="50" y="25" width="300" height="350" fill="#1a1a1a" stroke="#666" stroke-width="2" rx="5"/>
  
  <!-- Potentiometer 1 -->
  <circle cx="200" cy="110" r="35" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="200" cy="110" r="30" fill="#222"/>
  <line x1="200" y1="110" x2="200" y2="85" stroke="#ddd" stroke-width="3" stroke-linecap="round"/>
  <text x="200" y="65" font-family="Arial" font-size="14" fill="#aaa" text-anchor="middle">1</text>
  
  <!-- Potentiometer 2 -->
  <circle cx="200" cy="180" r="35" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="200" cy="180" r="30" fill="#222"/>
  <line x1="200" y1="180" x2="200" y2="155" stroke="#ddd" stroke-width="3" stroke-linecap="round"/>
  <text x="200" y="135" font-family="Arial" font-size="14" fill="#aaa" text-anchor="middle">2</text>
  
  <!-- Potentiometer 3 -->
  <circle cx="200" cy="250" r="35" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="200" cy="250" r="30" fill="#222"/>
  <line x1="200" y1="250" x2="200" y2="225" stroke="#ddd" stroke-width="3" stroke-linecap="round"/>
  <text x="200" y="205" font-family="Arial" font-size="14" fill="#aaa" text-anchor="middle">3</text>
  
  <!-- Potentiometer 4 -->
  <circle cx="200" cy="320" r="35" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="200" cy="320" r="30" fill="#222"/>
  <line x1="200" y1="320" x2="200" y2="295" stroke="#ddd" stroke-width="3" stroke-linecap="round"/>
  <text x="200" y="275" font-family="Arial" font-size="14" fill="#aaa" text-anchor="middle">4</text>
  
  <!-- Title -->
  <text x="200" y="390" font-family="Arial" font-size="12" fill="#888" text-anchor="middle">POT PANEL - 8HP</text>
</svg>
