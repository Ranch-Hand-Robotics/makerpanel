<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Panel background -->
  <rect width="400" height="400" fill="#2c2c2c"/>
  
  <!-- Panel outline -->
  <rect x="25" y="25" width="350" height="350" fill="#1a1a1a" stroke="#666" stroke-width="2" rx="5"/>
  
  <!-- USB-A Port 1 -->
  <rect x="80" y="90" width="40" height="20" fill="#333" stroke="#555" stroke-width="1" rx="2"/>
  <rect x="85" y="95" width="30" height="10" fill="#1a4d7a"/>
  <text x="100" y="80" font-family="Arial" font-size="10" fill="#aaa" text-anchor="middle">USB-A 1</text>
  
  <!-- USB-A Port 2 -->
  <rect x="80" y="140" width="40" height="20" fill="#333" stroke="#555" stroke-width="1" rx="2"/>
  <rect x="85" y="145" width="30" height="10" fill="#1a4d7a"/>
  <text x="100" y="130" font-family="Arial" font-size="10" fill="#aaa" text-anchor="middle">USB-A 2</text>
  
  <!-- USB-A Port 3 -->
  <rect x="80" y="230" width="40" height="20" fill="#333" stroke="#555" stroke-width="1" rx="2"/>
  <rect x="85" y="235" width="30" height="10" fill="#1a4d7a"/>
  <text x="100" y="220" font-family="Arial" font-size="10" fill="#aaa" text-anchor="middle">USB-A 3</text>
  
  <!-- USB-A Port 4 -->
  <rect x="80" y="280" width="40" height="20" fill="#333" stroke="#555" stroke-width="1" rx="2"/>
  <rect x="85" y="285" width="30" height="10" fill="#1a4d7a"/>
  <text x="100" y="270" font-family="Arial" font-size="10" fill="#aaa" text-anchor="middle">USB-A 4</text>
  
  <!-- USB-C Port 1 -->
  <rect x="280" y="120" width="40" height="15" fill="#333" stroke="#555" stroke-width="1" rx="3"/>
  <rect x="285" y="125" width="30" height="5" fill="#555"/>
  <text x="300" y="110" font-family="Arial" font-size="10" fill="#aaa" text-anchor="middle">USB-C 1</text>
  
  <!-- USB-C Port 2 -->
  <rect x="280" y="250" width="40" height="15" fill="#333" stroke="#555" stroke-width="1" rx="3"/>
  <rect x="285" y="255" width="30" height="5" fill="#555"/>
  <text x="300" y="240" font-family="Arial" font-size="10" fill="#aaa" text-anchor="middle">USB-C 2</text>
  
  <!-- Status LEDs -->
  <circle cx="200" cy="100" r="4" fill="#33ff33"/>
  <circle cx="200" cy="150" r="4" fill="#33ff33"/>
  <circle cx="200" cy="240" r="4" fill="#333"/>
  <circle cx="200" cy="290" r="4" fill="#333"/>
  
  <!-- Power LED -->
  <circle cx="200" cy="60" r="5" fill="#3333ff"/>
  <circle cx="200" cy="60" r="7" fill="none" stroke="#6666ff" stroke-width="1" opacity="0.5"/>
  <text x="200" y="50" font-family="Arial" font-size="10" fill="#aaa" text-anchor="middle">PWR</text>
  
  <!-- Title -->
  <text x="200" y="390" font-family="Arial" font-size="12" fill="#888" text-anchor="middle">USB HUB - 12HP</text>
</svg>
