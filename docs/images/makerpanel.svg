<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Dark background -->
  <rect width="200" height="200" fill="#1a1a1a"/>
  
  <!-- Neon green border circle -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#00ff00" stroke-width="4"/>
  
  <!-- Wrench icon in center -->
  <g transform="translate(100, 90)">
    <!-- Wrench head -->
    <rect x="-15" y="-35" width="30" height="25" fill="#00ff00" rx="3"/>
    <circle cx="0" cy="-22" r="8" fill="#1a1a1a"/>
    
    <!-- Wrench handle -->
    <rect x="-6" y="-10" width="12" height="50" fill="#00ff00" rx="2"/>
  </g>
  
  <!-- MP text -->
  <text x="100" y="155" font-family="Courier New, monospace" font-size="36" 
        font-weight="900" fill="#00ff00" text-anchor="middle" letter-spacing="3">MP</text>
</svg>
