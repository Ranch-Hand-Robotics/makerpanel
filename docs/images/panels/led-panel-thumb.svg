  <rect width="400" height="400" fill="#2c2c2c"/>
  
  <!-- Panel outline -->
  <rect x="75" y="25" width="250" height="350" fill="#1a1a1a" stroke="#666" stroke-width="2" rx="5"/>
  
  <!-- LED 1 -->
  <circle cx="200" cy="70" r="8" fill="#ff3333"/>
  <circle cx="200" cy="70" r="10" fill="none" stroke="#ff6666" stroke-width="1" opacity="0.5"/>
  <text x="230" y="75" font-family="Arial" font-size="14" fill="#aaa">1</text>
  
  <!-- LED 2 -->
  <circle cx="200" cy="110" r="8" fill="#ff3333"/>
  <circle cx="200" cy="110" r="10" fill="none" stroke="#ff6666" stroke-width="1" opacity="0.5"/>
  <text x="230" y="115" font-family="Arial" font-size="14" fill="#aaa">2</text>
  
  <!-- LED 3 -->
  <circle cx="200" cy="150" r="8" fill="#ff3333"/>
