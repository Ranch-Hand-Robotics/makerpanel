  <text x="230" y="155" font-family="Arial" font-size="14" fill="#aaa">3</text>
  
  <!-- LED 4 -->
  <circle cx="200" cy="190" r="8" fill="#ff3333"/>
  <circle cx="200" cy="190" r="10" fill="none" stroke="#ff6666" stroke-width="1" opacity="0.5"/>
  <text x="230" y="195" font-family="Arial" font-size="14" fill="#aaa">4</text>
  
  <!-- LED 5 -->
  <circle cx="200" cy="230" r="8" fill="#333"/>
